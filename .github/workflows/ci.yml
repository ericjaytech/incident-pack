name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
          python -m pip check
          incident-pack --version
          incident-pack --service nginx --since 2h --preview >/dev/null

  shell:
    name: Shell quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats shellcheck shfmt

      - name: Run ShellCheck
        run: shellcheck src/incident_pack/collectors/*.sh tests/bats/*.bats

      - name: Check shell formatting
        run: |
          shfmt -d -ln bash src/incident_pack/collectors/*.sh
          shfmt -d -ln bats tests/bats/*.bats

      - name: Run Bats tests
        run: bats tests/bats
